{% extends 'base.html' %}{% block body %}<h1>Your notes</h1><p>Team {{ team }}</p><form method="post" action="{{ url_for('create_note') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Title <input name="title" maxlength="120" required></label><label>Note <textarea name="body" maxlength="10000" required></textarea></label><button>Save note</button></form>{% for n in notes %}<article><h2>{{ n.title }}</h2><p>{{ n.body }}</p><a href="{{ url_for('export_note',note_id=n.id) }}">Export PDF</a></article>{% else %}<p>No notes yet.</p>{% endfor %}{% endblock %}
