services:
  notevault:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      TEAM_ID: ${TEAM_ID:?Set TEAM_ID before first build}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
      COOKIE_SECURE: "0" # Set to 1 behind HTTPS
      NOTES_DB: /data/notes.db
    volumes: ["notevault-data:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  notevault-data:
